name: Crypto Signal Bot

on:
  schedule:
    # هر ۳ ساعت (۰۰-۰۳-۰۶-۰۹-۱۲-۱۵-۱۸-۲۱ UTC) - می‌تونی زمانش رو تغییر بدی
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # این باعث میشه بتونی از تب Actions دستی هم اجراش کنی

permissions:
  contents: write   # لازمه تا ربات بتونه فایل تاریخچه سیگنال‌ها رو تو ریپو ذخیره (commit) کنه

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save signal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_signals.json
          git diff --staged --quiet || git commit -m "Update signal history [skip ci]"
          git push
